<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f7fb">
    <title>Consulta Clima</title>
    <link rel="stylesheet" href="/static/css/styles.css">
  </head>
  <body>
    <main class="dashboard">
      <header class="dashboard__header">
        <p class="dashboard__eyebrow">Seu tempo, em um só lugar</p>
        <h1>Consulta Clima</h1>
      </header>

      <form class="city-search" id="city-search">
        <label for="city-query">Consultar outra cidade</label>
        <div class="city-search__controls">
          <input
            id="city-query"
            name="city"
            type="search"
            minlength="2"
            maxlength="100"
            autocomplete="off"
            placeholder="Ex.: Curitiba"
            required
          >
          <button id="search-submit" type="submit">Buscar</button>
        </div>
        <p class="city-search__message" id="search-message" role="status" aria-live="polite"></p>
        <ul
          class="city-search__results"
          id="search-results"
          aria-label="Resultados da busca"
          aria-live="polite"
        ></ul>
      </form>

      <section class="weather-card" aria-labelledby="weather-title">
        <p class="weather-card__location" id="location">Buscando localização…</p>
        <div class="weather-card__main">
          <img class="weather-card__icon" id="weather-icon" alt="">
          <div>
            <h2 class="weather-card__temperature" id="temperature">--°</h2>
            <p class="weather-card__description" id="description">Carregando clima…</p>
          </div>
        </div>
        <h3 id="weather-title">Condições atuais</h3>
        <dl class="weather-details">
          <div>
            <dt>Sensação térmica</dt>
            <dd id="feels-like">--</dd>
          </div>
          <div>
            <dt>Umidade</dt>
            <dd id="humidity">--</dd>
          </div>
        </dl>
        <p class="weather-card__message" id="message" role="status" aria-live="polite"></p>
        <button class="retry-button" id="retry" type="button" hidden>Tentar novamente</button>
      </section>
    </main>
    <script type="module" src="/static/js/main.js"></script>
  </body>
</html>
